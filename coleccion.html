<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo — Moldes &amp; Plásticos de Colombia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="collection">
<div id="hdr"></div>
<main class="wrap">
  <nav class="crumbs" aria-label="Ruta"><a href="index.html">Inicio</a><svg class="ico" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg><span id="crumbHere"></span></nav>
  <header class="col-hero">
    <h1 id="colTitle"></h1>
    <p id="colDesc"></p>
    <div class="subnav" id="pills"></div>
  </header>
  <div class="col-layout">
    <aside class="facets" aria-label="Filtros">
      <div class="facets-head"><h3>Filtros</h3><button class="tool" data-close aria-label="Cerrar filtros"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div id="facetBody"></div>
    </aside>
    <section>
      <div class="toolbar">
        <div style="display:flex;gap:12px;align-items:center">
          <button class="btn btn-line filter-open" data-filters style="padding:10px 18px"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></svg>Filtrar</button>
          <span class="count-txt" id="countTxt"></span>
        </div>
        <div class="toolbar-r">
          <label class="sr" for="sort">Ordenar por</label>
          <select class="select" id="sort">
            <option value="best">Más vendidos</option>
            <option value="new">Novedades</option>
            <option value="asc">Precio: menor a mayor</option>
            <option value="desc">Precio: mayor a menor</option>
            <option value="az">Alfabéticamente, A–Z</option>
            <option value="za">Alfabéticamente, Z–A</option>
          </select>
          <div class="density" role="group" aria-label="Vista de cuadrícula">
            <button data-cols="3" aria-label="3 columnas"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/></svg></button>
            <button data-cols="4" aria-label="4 columnas"><svg class="ico" viewBox="0 0 24 24"><path d="M4 4h4v4H4zM10 4h4v4h-4zM16 4h4v4h-4zM4 10h4v4H4zM10 10h4v4h-4zM16 10h4v4h-4zM4 16h4v4H4zM10 16h4v4h-4zM16 16h4v4h-4z"/></svg></button>
          </div>
        </div>
      </div>
      <div class="chips" id="chips"></div>
      <div class="grid" id="grid"></div>
    </section>
  </div>
</main>
<div id="ftr"></div>
<script src="js/app.js"></script>
</body>
</html>
